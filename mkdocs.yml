site_name: Pensamiento Computacionalpara la Agronomia
site_description: Documentación del curso de Pensamiento Computacional
nav:
  - Index : index.md
  - Sesion  1 : 
     - Contenido : sesion1.md
     - Arduino : arduino.md
     - Tinkercad : tinkercard.md
  - Sesion  2 : 
    - Contenido :  sesion2.md
    - Pseudocodigo: pseudocodigo.md
    - Diagrama de flujo : diagrama.md
  - Sesion  3 : sesion3.md
  - Sesion  4 : sesion4.md
  - Sesion  5 : sesion5.md
  - Sesion  6 : sesion6.md



theme:
  name: 'material'
  language: 'es'
  font:
    text: Roboto
    code: Roboto Mono
  plugins: 
  #  - codeinclude 
   - search  

  logo: assets/logo.png
  favicon: assets/favicon.png
  features:
    - navigation.footer
    # - navigation.expand
    - navigation.sections  # Habilita la generación automática de índices
    - content.tabs.link
    - content.code.annotate
    - content.tooltips
    # - toc.integrate  # Habilita la integración de la tabla de contenido
    
    
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: black
      accent: deep purple

    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: purple
      accent: orange

extra_css:
  - assets/stylesheets/styles.css

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      # emoji_index: !!python/name:pymdownx.emoji.gemoji
      # emoji_generator: !!python/name:pymdownx.emoji.to_png
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid          
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details

